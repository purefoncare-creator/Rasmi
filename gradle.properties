org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9: KSP adds generated sources via kotlin.sourceSets, which built-in Kotlin disallows by default.
# This escape hatch suppresses that check. Temporary; may be removable once KSP uses android.sourceSets.
android.disallowKotlinSourceSets=false

# AGP 9 enables R8 "strict full mode" (strictFullModeForKeepRules=true) by default.
# ML Kit's bundled barcode-scanning ships consumer ProGuard rules that are not
# compatible with this strict mode, so R8 merges/drops reflective DI internals
# (e.g. com.google.mlkit.common.sdkinternal.ExecutorSelector), causing
# "Unsatisfied dependency for component ... MlKitInitProvider.onCreate" at startup.
# Disabling strict full mode restores the previous keep-rule behaviour. Official
# workaround referenced in googlesamples/mlkit#1001/#1007.
android.r8.strictFullModeForKeepRules=false
